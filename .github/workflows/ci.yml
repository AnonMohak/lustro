name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            setup/src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Setup lint and tests
        working-directory: setup/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # CI has no updater signing key (pull requests cannot read secrets), so it skips the update package.
      - name: Build installer
        run: npm run tauri build -- --config src-tauri/tauri.ci.conf.json

      - name: Build Lustro Setup
        run: npm run build:setup

      - uses: actions/upload-artifact@v4
        with:
          name: lustro-installer
          path: |
            src-tauri/target/release/bundle/setup/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
