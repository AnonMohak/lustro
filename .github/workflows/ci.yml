name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            setup/src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Setup lint and tests
        working-directory: setup/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # CI has no updater signing key (pull requests cannot read secrets), so it skips the update package.
      - name: Build installer
        run: npm run tauri build -- --config src-tauri/tauri.ci.conf.json

      - name: Build Lustro Setup
        run: npm run build:setup

      - uses: actions/upload-artifact@v4
        with:
          name: lustro-installer
          path: |
            src-tauri/target/release/bundle/setup/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # shared-plan.md: the backend compiles and its tests pass on Linux and macOS.
  # Tests that delete in the temp folder stay off on macOS (it is under the protected /var/folders).
  unix-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # shared-plan.md Phase 5: the backend compiles for Android (phones, arm64). It does not link
  # or run there yet. The runner has the Android NDK; its clang compiles the C parts of crates.
  android-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust lint (Android)
        working-directory: src-tauri
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android30-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          cargo clippy --target aarch64-linux-android --all-targets -- -D warnings

  # shared-plan.md Phase 6: the backend compiles for iOS and iPadOS (devices, arm64).
  # It does not link or run there yet. The runner has Xcode and the iOS SDK.
  ios-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust lint (iOS)
        working-directory: src-tauri
        run: cargo clippy --target aarch64-apple-ios --all-targets -- -D warnings

  # The Linux packages (.deb and AppImage), for manual tests. Like the Windows build,
  # it skips the update package (pull requests cannot read the signing key).
  linux-bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Build packages
        run: npm run tauri build -- --config src-tauri/tauri.ci.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: lustro-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # The macOS app and .dmg (Apple silicon, ad-hoc signature), for manual tests on a Mac.
  macos-bundle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Build packages
        run: npm run tauri build -- --config src-tauri/tauri.ci.conf.json

      # The ad-hoc signature must be valid; Gatekeeper rejects it (no Developer ID), as expected.
      - name: Check the signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Lustro.app

      - uses: actions/upload-artifact@v4
        with:
          name: lustro-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
