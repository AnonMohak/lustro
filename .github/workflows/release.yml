name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            setup/src-tauri

      - name: Install npm packages
        run: npm ci

      # Builds the installer, signs the update package and uploads both with latest.json.
      # The release stays a draft until someone publishes it on GitHub.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lustro ${{ github.ref_name }}"
          releaseBody: |
            Download **Lustro-Setup-<version>.exe** and run it. The other .exe is the update package
            that Lustro downloads by itself; you do not need it.

            See the README for what Lustro does. Windows SmartScreen may warn about an unknown
            publisher: the installer is not code-signed yet. Choose "More info", then "Run anyway".
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # The themed installer (setup/) holds the NSIS installer that tauri-action just built.
      - name: Build Lustro Setup
        run: npm run build:setup

      - name: Upload Lustro Setup
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" src-tauri/target/release/bundle/setup/Lustro-Setup-*.exe --clobber
