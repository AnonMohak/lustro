[package]
name = "lustro"
version = "0.1.0"
description = "Storage manager for Windows 11"
authors = ["Mohak"]
license = "MIT"
repository = "https://github.com/AnonMohak/lustro"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lustro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Services", "Management_Deployment", "ApplicationModel", "Foundation", "Foundation_Collections", "Storage"] }
thiserror = "2.0.21"
rayon = "1.12.0"
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
log = "0.4.34"
tauri-plugin-dialog = "2.8.3"
trash = "5.2.9"
toml = "1.1.8"
glob = "0.3.4"
blake3 = "1.8.7"
winreg = "0.56.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Optimized but quick to build. For timing tests: cargo test --profile perf
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
panic = "unwind"
