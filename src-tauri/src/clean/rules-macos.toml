# Lustro cleaner rules for macOS. Built into the app; the UI cannot add paths or commands.
# The fields are the same as in rules.toml. %HOME% is the home folder.
# Paths outside the home folder need admin rights (Lustro started as root).
# Most folders in ~/Library need Full Disk Access; without it, a rule measures 0 bytes.
# There is no rule for all of ~/Library/Caches: the rules below cover parts of it,
# and one rule for the whole folder would count those parts twice.

# ---------- System junk ----------

[[rule]]
id = "recycle-bin"
group = "sys"
name = "Trash"
desc = "After this, you cannot restore these items."
special = "recycle-bin"
safe = false

[[rule]]
id = "user-logs"
group = "sys"
name = "App logs and crash reports"
desc = "Log files and crash reports in ~/Library/Logs that nobody changed for 7 days."
paths = ['%HOME%/Library/Logs/*']
safe = true
min_age_h = 168

[[rule]]
id = "system-logs"
group = "sys"
name = "System logs and crash reports"
desc = "Log files and crash reports in /Library/Logs that nobody changed for 7 days."
paths = ['/Library/Logs/*']
safe = true
admin = true
min_age_h = 168

[[rule]]
id = "quicklook-cache"
group = "sys"
name = "Quick Look thumbnails"
desc = "The Finder makes new thumbnails when it needs them."
paths = ['%HOME%/Library/Caches/com.apple.QuickLook.thumbnailcache/*']
safe = true

[[rule]]
id = "ios-backups"
group = "sys"
name = "iPhone and iPad backups"
desc = "Local backups that the Finder made. Check that you do not need them, or that iCloud has a backup."
paths = ['%HOME%/Library/Application Support/MobileSync/Backup/*']
warn = true

[[rule]]
id = "ios-updates"
group = "sys"
name = "iPhone and iPad software updates"
desc = "Update files that the Finder downloaded. It downloads them again when it needs them."
paths = ['%HOME%/Library/iTunes/iPhone Software Updates/*', '%HOME%/Library/iTunes/iPad Software Updates/*']
safe = true

# ---------- Browsers ----------

[[rule]]
id = "safari-cache"
group = "web"
name = "Safari cache"
desc = "Cached web pages and images."
paths = ['%HOME%/Library/Caches/com.apple.Safari/*', '%HOME%/Library/Containers/com.apple.Safari/Data/Library/Caches/*']
safe = true
process = ["Safari"]

[[rule]]
id = "chrome-cache"
group = "web"
name = "Chrome cache"
desc = "Cached web pages and images of all Chrome profiles."
paths = ['%HOME%/Library/Caches/Google/Chrome/*/Cache', '%HOME%/Library/Caches/Google/Chrome/*/Code Cache', '%HOME%/Library/Application Support/Google/Chrome/*/GPUCache']
safe = true
process = ["Google Chrome"]

[[rule]]
id = "edge-cache"
group = "web"
name = "Edge cache"
desc = "Cached web pages and images of all Edge profiles."
paths = ['%HOME%/Library/Caches/Microsoft Edge/*/Cache', '%HOME%/Library/Caches/Microsoft Edge/*/Code Cache', '%HOME%/Library/Application Support/Microsoft Edge/*/GPUCache']
safe = true
process = ["Microsoft Edge"]

[[rule]]
id = "brave-cache"
group = "web"
name = "Brave cache"
desc = "Cached web pages and images of all Brave profiles."
paths = ['%HOME%/Library/Caches/BraveSoftware/Brave-Browser/*/Cache', '%HOME%/Library/Caches/BraveSoftware/Brave-Browser/*/Code Cache', '%HOME%/Library/Application Support/BraveSoftware/Brave-Browser/*/GPUCache']
safe = true
process = ["Brave Browser"]

[[rule]]
id = "firefox-cache"
group = "web"
name = "Firefox cache"
desc = "Cached web pages and images of all Firefox profiles."
paths = ['%HOME%/Library/Caches/Firefox/Profiles/*/cache2', '%HOME%/Library/Caches/Firefox/Profiles/*/startupCache']
safe = true
process = ["firefox"]

[[rule]]
id = "chrome-history"
group = "web"
name = "Chrome history and cookies"
desc = "Signs you out of websites. Passwords, bookmarks and extensions stay."
paths = ['%HOME%/Library/Application Support/Google/Chrome/*/History', '%HOME%/Library/Application Support/Google/Chrome/*/History-journal', '%HOME%/Library/Application Support/Google/Chrome/*/Cookies', '%HOME%/Library/Application Support/Google/Chrome/*/Cookies-journal']
warn = true
process = ["Google Chrome"]

[[rule]]
id = "firefox-history"
group = "web"
name = "Firefox cookies and form history"
desc = "Signs you out of websites. Browsing history, passwords and bookmarks stay (Firefox keeps history together with bookmarks)."
paths = ['%HOME%/Library/Application Support/Firefox/Profiles/*/cookies.sqlite', '%HOME%/Library/Application Support/Firefox/Profiles/*/formhistory.sqlite']
warn = true
process = ["firefox"]

# ---------- Dev junk ----------
# "dev-projects" finds node_modules, target, bin/obj and similar folders in your scans.

[[rule]]
id = "dev-projects"
group = "dev"
name = "Build and package folders in projects"
desc = "node_modules, Rust target, .NET bin/obj, .venv, .next, .gradle. Projects with no change for 30 days are selected."
special = "dev-projects"
safe = true

[[rule]]
id = "xcode-derived"
group = "dev"
name = "Xcode DerivedData"
desc = "Build files and indexes of Xcode projects. Xcode builds them again."
paths = ['%HOME%/Library/Developer/Xcode/DerivedData/*']
safe = true
process = ["Xcode"]

[[rule]]
id = "xcode-device-support"
group = "dev"
name = "Xcode device support files"
desc = "Debug symbols for each iOS version of a connected device. Xcode copies them again from the device."
paths = ['%HOME%/Library/Developer/Xcode/iOS DeviceSupport/*', '%HOME%/Library/Developer/Xcode/watchOS DeviceSupport/*']
process = ["Xcode"]

[[rule]]
id = "xcode-simulators"
group = "dev"
name = "Simulators of old Xcode versions"
desc = "Runs xcrun simctl delete unavailable: simulators whose runtime no Xcode has. Their apps and data are lost."
special = "xcode-simulators"
safe = true
process = ["Simulator"]

[[rule]]
id = "simulator-caches"
group = "dev"
name = "Simulator caches"
desc = "Caches of the iOS Simulator. It makes them again."
paths = ['%HOME%/Library/Developer/CoreSimulator/Caches/*']
safe = true
process = ["Simulator"]

[[rule]]
id = "homebrew-cache"
group = "dev"
name = "Homebrew downloads"
desc = "Downloaded package files. Homebrew downloads them again when it needs them."
paths = ['%HOME%/Library/Caches/Homebrew/*']
safe = true
process = ["brew"]

[[rule]]
id = "npm-cache"
group = "dev"
name = "npm cache"
desc = "Packages download again when you need them."
paths = ['%HOME%/.npm/_cacache', '%HOME%/.npm/_npx']
safe = true

[[rule]]
id = "yarn-pnpm-cache"
group = "dev"
name = "Yarn and pnpm caches"
desc = "Packages download again when you need them."
paths = ['%HOME%/Library/Caches/Yarn', '%HOME%/Library/pnpm/store']
safe = true

[[rule]]
id = "pip-cache"
group = "dev"
name = "pip cache"
desc = "Python packages download again when you need them."
paths = ['%HOME%/Library/Caches/pip']
safe = true

[[rule]]
id = "go-cache"
group = "dev"
name = "Go build cache"
desc = "Go builds the packages again at the next build."
paths = ['%HOME%/Library/Caches/go-build']
safe = true

[[rule]]
id = "cocoapods-cache"
group = "dev"
name = "CocoaPods cache"
desc = "Pods download again at the next pod install."
paths = ['%HOME%/Library/Caches/CocoaPods']
safe = true

[[rule]]
id = "cargo-cache"
group = "dev"
name = "Cargo registry cache"
desc = "Crates download again at the next build."
paths = ['%HOME%/.cargo/registry/cache', '%HOME%/.cargo/registry/src', '%HOME%/.cargo/git/checkouts']

[[rule]]
id = "gradle-maven-cache"
group = "dev"
name = "Gradle and Maven caches"
desc = "Dependencies download again at the next build."
paths = ['%HOME%/.gradle/caches', '%HOME%/.m2/repository']

# ---------- Docker ----------

[[rule]]
id = "docker-images"
group = "docker"
name = "Docker images that no container uses"
desc = "Runs docker image prune -a. Images download again when you need them."
special = "docker-images"
safe = true

[[rule]]
id = "docker-build"
group = "docker"
name = "Docker build cache"
desc = "Runs docker builder prune. Builds run slower one time."
special = "docker-build"
safe = true

[[rule]]
id = "docker-containers"
group = "docker"
name = "Stopped Docker containers"
desc = "Runs docker container prune. The data inside these containers is lost."
special = "docker-containers"
warn = true

# ---------- IDE caches ----------

[[rule]]
id = "vscode-cache"
group = "ide"
name = "VS Code cache"
desc = "Caches, logs and downloaded extension packages. VS Code makes them again."
paths = ['%HOME%/Library/Application Support/Code/Cache', '%HOME%/Library/Application Support/Code/CachedData', '%HOME%/Library/Application Support/Code/CachedExtensionVSIXs', '%HOME%/Library/Application Support/Code/Code Cache', '%HOME%/Library/Application Support/Code/GPUCache', '%HOME%/Library/Application Support/Code/logs']
safe = true
process = ["Code", "Electron"]

[[rule]]
id = "jetbrains-old"
group = "ide"
name = "JetBrains data of old versions"
desc = "Caches and logs of IDE versions that a newer version replaced."
special = "jetbrains-old"
safe = true

# ---------- App caches ----------
# One item for each cache folder that no other rule covers. The cleaner empties each folder.

[[rule]]
id = "app-caches"
group = "cache"
name = "Caches of each app"
desc = "Folders in ~/Library/Caches and the caches of sandboxed apps (App Store apps). macOS has no button to clear them. Apps make them again, so their next start can be slower. Browsers and dev tools are in their own groups."
special = "app-caches"
safe = true
