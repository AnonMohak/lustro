<title>Lustro Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a Windows 11 glass window on a wallpaper. Sidebar | list | main | detail, status bar below (after the reference). */
:root {
  --wall-1: #c3d3dd; --wall-2: #e6d7c3; --wall-3: #8fb3c2; --wall-4: #eef0ee;
  --win: rgba(243, 244, 247, .80);
  --pane: rgba(255, 255, 255, .42);
  --card: rgba(255, 255, 255, .74);
  --ctl: rgba(255, 255, 255, .82);
  --ctl-hover: rgba(250, 250, 252, .96);
  --hover: rgba(20, 24, 40, .05);
  --active: rgba(20, 24, 40, .085);
  --stroke: rgba(20, 24, 40, .09);
  --stroke-2: rgba(20, 24, 40, .17);
  --fg: #191b20; --fg-2: #555b66; --fg-3: #858b96;
  --accent: #3d57d6; --accent-hover: #3248b8; --accent-fg: #ffffff; --accent-soft: rgba(61, 87, 214, .12);
  --good: #13803f; --good-soft: rgba(19, 128, 63, .12);
  --warn: #9a5400; --warn-soft: rgba(196, 120, 0, .14);
  --bad: #c42b1c; --bad-soft: rgba(196, 43, 28, .10);
  --c-video: #e46a8a; --c-image: #eeaa45; --c-doc: #5b95ea; --c-app: #9a7bec; --c-game: #43b98f;
  --c-archive: #cf9561; --c-system: #8b94a3; --c-dev: #3cbccf; --c-other: #b4b9c2;
  --tile-fg: rgba(12, 14, 20, .88);
  --shadow: 0 30px 80px rgba(20, 30, 50, .28), 0 0 0 1px rgba(20, 24, 40, .10);
  --overlay: rgba(10, 12, 18, .30);
  --f-ui: "Segoe UI Variable Text", "Segoe UI", "Open Sans", system-ui, sans-serif;
  --f-display: "Segoe UI Variable Display", "Segoe UI", "Open Sans", system-ui, sans-serif;
  --f-mono: "Cascadia Mono", "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall-1: #0d1a17; --wall-2: #1d302b; --wall-3: #2b4750; --wall-4: #111618;
    --win: rgba(30, 32, 36, .76); --pane: rgba(255, 255, 255, .025); --card: rgba(255, 255, 255, .045);
    --ctl: rgba(255, 255, 255, .06); --ctl-hover: rgba(255, 255, 255, .095);
    --hover: rgba(255, 255, 255, .05); --active: rgba(255, 255, 255, .085);
    --stroke: rgba(255, 255, 255, .075); --stroke-2: rgba(255, 255, 255, .15);
    --fg: #ebedf0; --fg-2: #a5aab3; --fg-3: #767c87;
    --accent: #91a4ff; --accent-hover: #a9b8ff; --accent-fg: #0d1124; --accent-soft: rgba(145, 164, 255, .15);
    --good: #5fd38d; --good-soft: rgba(95, 211, 141, .13);
    --warn: #f0b35a; --warn-soft: rgba(240, 179, 90, .13);
    --bad: #ff8a7a; --bad-soft: rgba(255, 138, 122, .12);
    --c-video: #ec7c98; --c-image: #f2b65a; --c-doc: #6ea3f0; --c-app: #a88cf2; --c-game: #52c79c;
    --c-archive: #d8a272; --c-system: #98a1af; --c-dev: #4fc8da; --c-other: #8f95a0;
    --shadow: 0 30px 90px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08);
    --overlay: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall-1: #0d1a17; --wall-2: #1d302b; --wall-3: #2b4750; --wall-4: #111618;
  --win: rgba(30, 32, 36, .76); --pane: rgba(255, 255, 255, .025); --card: rgba(255, 255, 255, .045);
  --ctl: rgba(255, 255, 255, .06); --ctl-hover: rgba(255, 255, 255, .095);
  --hover: rgba(255, 255, 255, .05); --active: rgba(255, 255, 255, .085);
  --stroke: rgba(255, 255, 255, .075); --stroke-2: rgba(255, 255, 255, .15);
  --fg: #ebedf0; --fg-2: #a5aab3; --fg-3: #767c87;
  --accent: #91a4ff; --accent-hover: #a9b8ff; --accent-fg: #0d1124; --accent-soft: rgba(145, 164, 255, .15);
  --good: #5fd38d; --good-soft: rgba(95, 211, 141, .13);
  --warn: #f0b35a; --warn-soft: rgba(240, 179, 90, .13);
  --bad: #ff8a7a; --bad-soft: rgba(255, 138, 122, .12);
  --c-video: #ec7c98; --c-image: #f2b65a; --c-doc: #6ea3f0; --c-app: #a88cf2; --c-game: #52c79c;
  --c-archive: #d8a272; --c-system: #98a1af; --c-dev: #4fc8da; --c-other: #8f95a0;
  --shadow: 0 30px 90px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08);
  --overlay: rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  display: flex; flex-direction: column; gap: 12px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font: 13px/1.45 var(--f-ui); color: var(--fg);
  background:
    radial-gradient(55% 70% at 12% 18%, var(--wall-3), transparent 70%),
    radial-gradient(50% 60% at 88% 85%, var(--wall-2), transparent 72%),
    radial-gradient(40% 45% at 72% 8%, var(--wall-1), transparent 70%),
    var(--wall-4);
  background-attachment: fixed;
}
button { font: inherit; color: inherit; }
.mono { font-family: var(--f-mono); font-size: 11.5px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }

/* icons */
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* mockup bar (outside the app) */
.mockbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; max-width: 1480px; width: 100%; margin-inline: auto; color: var(--fg-2); font-size: 12.5px; }
.mockbar b { color: var(--fg); font-family: var(--f-display); font-size: 14px; letter-spacing: .01em; }
.mockbar .grow { flex: 1; }

/* segmented control */
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 7px; background: var(--hover); border: 1px solid var(--stroke); }
.seg button { border: 0; background: none; padding: 3px 11px; border-radius: 5px; cursor: pointer; color: var(--fg-2); font-size: 12.5px; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--ctl-hover); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 1px var(--stroke); }

/* window */
.window {
  flex: 1; min-height: 620px; width: 100%; max-width: 1480px; margin-inline: auto;
  display: grid; grid-template-rows: 40px minmax(0, 1fr) 30px;
  border-radius: 10px; overflow: hidden;
  background: var(--win);
  -webkit-backdrop-filter: blur(48px) saturate(1.5); backdrop-filter: blur(48px) saturate(1.5);
  box-shadow: var(--shadow);
}
.titlebar { display: flex; align-items: center; gap: 10px; padding-left: 14px; user-select: none; }
.logo { width: 18px; height: 18px; flex: none; }
.appname { font-family: var(--f-display); font-weight: 600; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; border: 1px solid var(--stroke); background: var(--hover); color: var(--fg-2); cursor: pointer; }
.chip .i { width: 13px; height: 13px; }
.chip:hover { color: var(--fg); background: var(--active); }
.chip.admin { background: var(--good-soft); color: var(--good); border-color: transparent; cursor: default; }
.titlebar .grow { flex: 1; }
.caps { display: flex; align-self: stretch; }
.caps button { width: 46px; border: 0; background: none; display: grid; place-items: center; cursor: default; color: var(--fg-2); }
.caps button:hover { background: var(--hover); color: var(--fg); }
.caps button.x:hover { background: #c42b1c; color: #fff; }
.caps .i { width: 14px; height: 14px; stroke-width: 1.2; }

.wbody { display: flex; min-height: 0; border-top: 1px solid var(--stroke); }
.sidebar { width: 232px; flex: none; display: flex; flex-direction: column; gap: 1px; padding: 8px; overflow-y: auto; }
.list { width: 300px; flex: none; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--stroke); background: var(--pane); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; overflow: auto; border-left: 1px solid var(--stroke); background: var(--pane); }
.detail { width: 300px; flex: none; overflow-y: auto; border-left: 1px solid var(--stroke); background: var(--pane); }
.status { display: flex; align-items: center; gap: 14px; padding: 0 12px; border-top: 1px solid var(--stroke); color: var(--fg-2); font-size: 12px; white-space: nowrap; overflow: hidden; }
.status .grow { flex: 1; }
.status .sep { color: var(--fg-3); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); flex: none; }
.dot.live { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }

/* sidebar */
.sbtn { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; text-align: left; color: var(--fg); position: relative; width: 100%; }
.sbtn:hover { background: var(--hover); }
.sbtn.on { background: var(--active); }
.sbtn.on::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--accent); }
.sbtn .i { color: var(--fg-2); }
.sbtn.on .i { color: var(--accent); }
.sbtn .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbtn .badge { font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.searchbtn { border: 1px solid var(--stroke); background: var(--ctl); margin-bottom: 8px; color: var(--fg-2); }
.kbd { font-size: 11px; color: var(--fg-3); }
.side-sec { display: flex; justify-content: space-between; align-items: center; padding: 14px 10px 6px; font-size: 11.5px; color: var(--fg-3); letter-spacing: .02em; }
.drv { height: auto; padding-block: 7px; align-items: flex-start; }
.drv .i { margin-top: 2px; }
.drive-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.drive-meta .top { display: flex; justify-content: space-between; gap: 6px; }
.drive-meta .free { font-size: 11px; color: var(--fg-3); white-space: nowrap; }
.minibar { height: 3px; border-radius: 2px; background: var(--active); overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.minibar i.warn { background: var(--warn); }
.sidebar .grow { flex: 1; min-height: 12px; }
.ver { font-size: 11px; color: var(--fg-3); }

/* shared bits */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--stroke); background: var(--ctl); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--ctl-hover); }
.btn.accent { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.accent:hover { background: var(--accent-hover); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; background: var(--hover); color: var(--fg-2); }
.pill .i { width: 12px; height: 12px; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.page { padding: 22px 26px 30px; display: flex; flex-direction: column; gap: 18px; max-width: 1100px; width: 100%; }
.phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.phead h2 { margin: 0; font: 600 22px/1.2 var(--f-display); text-wrap: balance; }
.phead p { margin: 4px 0 0; color: var(--fg-2); }
.sec { margin: 6px 0 0; font: 600 14px/1.3 var(--f-display); }
.card { background: var(--card); border: 1px solid var(--stroke); border-radius: 8px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.infobar { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--stroke); flex-wrap: wrap; }
.infobar > div { flex: 1; min-width: 220px; }
.infobar .ib-ic { color: var(--accent); display: grid; }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 9px 10px; border-radius: 6px; background: var(--hover); color: var(--fg-2); font-size: 12px; }
.note .i { margin-top: 1px; }
.note.lock { background: var(--bad-soft); color: var(--bad); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--stroke); background: var(--ctl); font-size: 12.5px; cursor: pointer; }
.fchip.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.fchip .i { width: 13px; height: 13px; }
input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; cursor: pointer; }
input[type="checkbox"]:disabled { cursor: not-allowed; }
.text { height: 32px; border-radius: 6px; border: 1px solid var(--stroke); border-bottom-color: var(--stroke-2); background: var(--ctl); padding: 0 10px; font: inherit; color: var(--fg); min-width: 0; }
.text:focus { outline: none; border-bottom: 2px solid var(--accent); }

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--stroke); border-radius: 8px; background: var(--card); }
table { width: 100%; border-collapse: collapse; min-width: 640px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--fg-2); padding: 9px 12px; border-bottom: 1px solid var(--stroke); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--stroke); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: default; }
tbody tr:hover td { background: var(--hover); }
tbody tr.sel td { background: var(--accent-soft); }
td.r, th.r { text-align: right; }
.fname { display: flex; align-items: center; gap: 9px; min-width: 0; }
.fname .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fname .pt { color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fname > div { min-width: 0; display: flex; flex-direction: column; }
.ftype { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); }
.ftype .i { width: 15px; height: 15px; }
.actbar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; background: var(--win); border: 1px solid var(--stroke); box-shadow: 0 8px 24px rgba(0,0,0,.12); flex-wrap: wrap; -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
.actbar .grow { flex: 1; }

/* list pane */
.lhead { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--stroke); }
.lhead .ttl { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lhead h3 { margin: 0; font: 600 14px/1.3 var(--f-display); }
.lscroll { flex: 1; overflow-y: auto; padding: 6px; min-height: 0; }
.trow { display: grid; grid-template-columns: 16px 18px minmax(0, 1fr) auto; grid-template-rows: auto 3px; column-gap: 6px; align-items: center; padding: 5px 8px 5px calc(6px + var(--d) * 14px); border-radius: 6px; cursor: pointer; }
.trow:hover { background: var(--hover); }
.trow.sel { background: var(--active); }
.trow .tw { border: 0; background: none; padding: 0; width: 16px; height: 16px; display: grid; place-items: center; color: var(--fg-3); cursor: pointer; }
.trow .tw .i { width: 12px; height: 12px; transition: transform .12s; }
.trow .tw.open .i { transform: rotate(90deg); }
.trow .ticon .i { width: 15px; height: 15px; }
.trow .tname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.trow .tname .i { width: 12px; height: 12px; color: var(--fg-3); }
.trow .tsize { font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.trow .tsize.deny { color: var(--warn); font-size: 11px; }
.trow .tbar { grid-column: 3 / 5; height: 3px; border-radius: 2px; background: var(--hover); overflow: hidden; margin-top: 3px; }
.trow .tbar i { display: block; height: 100%; border-radius: 2px; background: var(--c); opacity: .9; }
.grow-row { padding: 9px 10px; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.grow-row:hover { background: var(--hover); }
.grow-row.sel { background: var(--active); }
.grow-row .t1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.grow-row .t1 b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow-row .t2 { font-size: 12px; color: var(--fg-3); display: flex; justify-content: space-between; gap: 8px; }
.lgroup { padding: 10px 10px 4px; font-size: 11.5px; color: var(--fg-3); letter-spacing: .02em; }

/* explore main */
.mhead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--stroke); flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; overflow: hidden; }
.crumbs button { border: 0; background: none; padding: 3px 6px; border-radius: 5px; cursor: pointer; color: var(--fg-2); white-space: nowrap; font-size: 13px; }
.crumbs button:hover { background: var(--hover); color: var(--fg); }
.crumbs button:last-child { color: var(--fg); font-weight: 600; }
.crumbs .i { width: 12px; height: 12px; color: var(--fg-3); }
.tmwrap { flex: 1; min-height: 320px; padding: 10px 14px 0; display: flex; flex-direction: column; }
.tm { position: relative; flex: 1; min-height: 300px; border-radius: 6px; overflow: hidden; }
.tile { position: absolute; border-radius: 3px; overflow: hidden; cursor: pointer; }
.tile.leaf { background: radial-gradient(120% 120% at 25% 15%, rgba(255,255,255,.38), rgba(255,255,255,0) 60%), var(--c); color: var(--tile-fg); box-shadow: inset 0 0 0 1px rgba(0,0,0,.10); }
.tile.leaf:hover { filter: brightness(1.08) saturate(1.05); }
.tile.grp { background: color-mix(in srgb, var(--c) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); }
.tile.grp:hover { background: color-mix(in srgb, var(--c) 24%, transparent); }
.tile .tl { padding: 3px 6px; font-size: 11.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; }
.tile .tl b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.tile .tl span { opacity: .75; font-variant-numeric: tabular-nums; }
.tile.grp .tl { color: var(--fg); }
.tile.leaf .tl { flex-direction: column; gap: 0; white-space: normal; }
.tile.sel { box-shadow: inset 0 0 0 2px var(--fg), inset 0 0 0 3px var(--win); z-index: 2; }
.tile.prot.leaf { background: repeating-linear-gradient(135deg, rgba(0,0,0,.07) 0 6px, transparent 6px 12px), radial-gradient(120% 120% at 25% 15%, rgba(255,255,255,.3), rgba(255,255,255,0) 60%), var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px 12px; font-size: 12px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.hint { font-size: 12px; color: var(--fg-3); }
.types { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; max-width: 760px; }
.trow2 { display: grid; grid-template-columns: 28px 140px minmax(0, 1fr) 80px 52px; gap: 12px; align-items: center; }
.hbar { height: 10px; border-radius: 5px; background: var(--hover); overflow: hidden; }
.hbar i { display: block; height: 100%; border-radius: 5px; background: var(--c); }

/* detail pane */
.dt { padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; }
.dt-hero { display: flex; flex-direction: column; gap: 6px; }
.dt-ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); margin-bottom: 4px; }
.dt-ic .i { width: 24px; height: 24px; stroke-width: 1.3; }
.dt-name { font: 600 17px/1.25 var(--f-display); overflow-wrap: anywhere; }
.dt-path { color: var(--fg-3); overflow-wrap: anywhere; }
.big { font: 600 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

function squarify(items, x, y, w, h) {
  const out = []; const total = items.reduce((a, i) => a + i.v, 0); if (!total || w <= 0 || h <= 0) return out;
  const scale = w * h / total; let rest = items.map(i => ({ ...i, a: i.v * scale }));
  const worst = (row, s) => { const sum = row.reduce((a, r) => a + r.a, 0); const mx = Math.max(...row.map(r => r.a)), mn = Math.min(...row.map(r => r.a)); return Math.max(s * s * mx / (sum * sum), sum * sum / (s * s * mn)); };
  while (rest.length) {
    const short = Math.min(w, h); const row = [rest[0]]; let i = 1;
    while (i < rest.length && worst([...row, rest[i]], short) <= worst(row, short)) { row.push(rest[i]); i++; }
    const rs = row.reduce((a, r) => a + r.a, 0);
    if (w >= h) { const cw = rs / h; let yy = y; row.forEach(r => { const rh = r.a / cw; out.push({ ...r, x, y: yy, w: cw, h: rh }); yy += rh; }); x += cw; w -= cw; }
    else { const ch = rs / w; let xx = x; row.forEach(r => { const rw = r.a / ch; out.push({ ...r, x: xx, y, w: rw, h: ch }); xx += rw; }); y += ch; h -= ch; }
    rest = rest.slice(i);
  }
  return out;
}
function tileHtml(r, depth) {
  const n = r.node; if (r.w < 2 || r.h < 2) return '';
  const grp = n.c && r.w > 80 && r.h > 54 && depth < 3;
  const prot = isProt(n) ? 'prot' : '';
  const style = `left:${r.x + 1}px;top:${r.y + 1}px;width:${r.w - 2}px;height:${r.h - 2}px;--c:${cvar(n.t)}`;
  const label = (r.w > 56 && r.h > (grp ? 18 : 30)) ? `<div class="tl"><b>${esc(n.n)}</b><span>${fmt(n.s)}</span></div>` : '';
  let h = `<div class="tile ${grp ? 'grp' : 'leaf'} ${prot} ${S.sel === n ? 'sel' : ''}" data-act="sel" data-id="${n.id}" style="${style}" title="${esc(n.n)} · ${fmt(n.s)}">${label}</div>`;
  if (grp) h += squarify(n.c.map(c => ({ v: c.s, node: c })), r.x + 3, r.y + 21, r.w - 6, r.h - 24).map(s => tileHtml(s, depth + 1)).join('');
  return h;
}
function drawTreemap() {
  const box = $('#tm'); if (!box) return;
  const W = box.clientWidth, H = box.clientHeight;
  const kids = (S.zoom.c || []).filter(c => c.s > 0);
  box.innerHTML = squarify(kids.map(c => ({ v: c.s, node: c })), 0, 0, W, H).map(r => tileHtml(r, 0)).join('');
}

const SEARCH_POOL = [...FILES, ...SEARCH_EXTRA];
function searchRows(q) {
  const re = new RegExp('^' + q.trim().replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + (q.includes('*') ? '$' : ''), 'i');
  const hits = q.trim() ? SEARCH_POOL.filter(f => q.includes('*') ? re.test(f.n) : f.n.toLowerCase().includes(q.trim().toLowerCase())) : [];
  return { hits, html: hits.map(f => `<tr><td><div class="fname"><span class="ftype" style="--c:${cvar(f.t)}">${ic(TYPES[f.t][2])}</span><div><span class="nm">${esc(f.n)}</span><span class="pt mono">${esc(f.p)}</span></div></div></td><td class="r num">${fmt(f.s)}</td><td class="num">${fdate(f.d)}</td><td class="r"><button class="btn ghost sm" data-act="reveal" aria-label="Open folder">${ic('open')}</button></td></tr>`).join('') || `<tr><td colspan="4" class="muted">No files match “${esc(q)}”.</td></tr>` };
}
SCREENS.search = () => {
  const r = searchRows(S.q);
  return { main: `<div class="page">
    <div class="phead"><div><h2>Search files</h2><p>Searches the last scan of every drive. Use * and ? as wildcards.</p></div></div>
    <div class="row"><input class="text" id="q" value="${esc(S.q)}" placeholder="File name, for example *.iso" aria-label="Search" style="flex:1;min-width:200px;height:36px;font-size:14px"><div class="chips"><button class="fchip on">${ic('check')}All drives</button><button class="fchip">Any size ${ic('chev')}</button><button class="fchip">Any date ${ic('chev')}</button></div></div>
    <div class="faint num" id="qinfo">${r.hits.length} results · 1,431,882 files searched in 0.04 s</div>
    <div class="tbl"><table><thead><tr><th>Name</th><th class="r">Size</th><th>Modified</th><th></th></tr></thead><tbody id="qrows">${r.html}</tbody></table></div></div>` };
};

SCREENS.history = () => {
  const freed = HIST.filter(h => h.a !== 'Blocked').reduce((a, h) => a + h.s, 0);
  const pill = { 'Recycle Bin': 'acc', Cleaner: 'good', Permanent: 'bad', Blocked: 'warn' };
  return { main: `<div class="page">
    <div class="phead"><div><h2>History</h2><p>${fmt(freed)} freed this month. Lustro keeps this log on this PC only.</p></div><button class="btn sm" data-act="export">${ic('export')}Export CSV</button></div>
    <div class="tbl"><table><thead><tr><th>When</th><th>Action</th><th>Item</th><th class="r">Size</th><th></th></tr></thead><tbody>
    ${HIST.map((h, i) => `<tr><td class="num muted" style="white-space:nowrap">${h.t}</td><td><span class="pill ${pill[h.a]}">${h.a === 'Blocked' ? ic('lock') : ''}${h.a}</span></td>
      <td><div class="fname"><div><span class="nm">${esc(h.n)}</span><span class="pt mono">${esc(h.p)}</span></div></div></td>
      <td class="r num">${fmt(h.s)}</td>
      <td class="r">${h.restore ? `<button class="btn sm" data-act="restore" data-i="${i}">${ic('restore')}Restore</button>` : h.gone ? '<span class="faint" style="font-size:12px">Recycle Bin emptied</span>' : h.a === 'Blocked' ? '<span class="faint" style="font-size:12px">Protected system path</span>' : ''}</td></tr>`).join('')}
    </tbody></table></div></div>` };
};

function sw(id, on, dis) { return `<label class="switch"><input type="checkbox" id="${id}" ${on ? 'checked' : ''} ${dis ? 'disabled' : ''}><span></span></label>`; }
SCREENS.settings = () => ({ main: `<div class="page" style="max-width:820px">
  <div class="phead"><div><h2>Settings</h2></div></div>
  <h3 class="sec">Appearance</h3>
  <div class="card set"><div class="srow"><div><div>Theme</div><div class="sd">System follows the Windows light or dark setting.</div></div><div class="seg">${['system', 'light', 'dark'].map(v => `<button class="${S.theme === v ? 'on' : ''}" data-act="theme" data-v="${v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div></div></div>
  <h3 class="sec">Delete</h3>
  <div class="card set">
    <div class="srow"><div><div>Default delete</div><div class="sd">Shift+Delete always deletes permanently.</div></div><select class="text" id="setDel"><option>Move to Recycle Bin</option><option>Delete permanently</option></select></div>
    <div class="srow"><div><div>Ask before a permanent delete</div><div class="sd">Always on. You cannot undo a permanent delete.</div></div>${sw('setAsk', 1, 1)}</div>
    <div class="srow"><div><div>Protected system paths</div><div class="sd">Windows, Program Files, page file, drive roots and profile folders. Lustro never deletes them.</div></div><span class="pill bad">${ic('lock')}Always on</span></div></div>
  <h3 class="sec">Scanning</h3>
  <div class="card set">
    <div class="srow"><div><div>Fast scan on NTFS drives</div><div class="sd">Reads the Master File Table. Needs admin rights.</div></div>${sw('setMft', 1)}</div>
    <div class="srow"><div><div>Live updates</div><div class="sd">Reads the NTFS change journal, so results stay current without a rescan. Needs admin rights.</div></div>${sw('setUsn', 1)}</div>
    <div class="srow"><div><div>Show sizes as</div><div class="sd">"Size on disk" counts cluster slack and compression.</div></div><select class="text" id="setSize"><option>Size</option><option>Size on disk</option></select></div></div>
  <h3 class="sec">Clean up</h3>
  <div class="card set">
    <div class="srow"><div><div>Select dev project folders after</div><div class="sd">Lustro selects node_modules, target and similar folders only in projects with no change for this many days.</div></div><select class="text" id="setDays"><option>14 days</option><option selected>30 days</option><option>90 days</option></select></div></div>
  <h3 class="sec">Alerts and Windows</h3>
  <div class="card set">
    <div class="srow"><div><div>Low space alert</div><div class="sd">Lustro stays in the tray and sends a notification when a drive has less free space than this.</div></div><select class="text" id="setLow"><option>5% free</option><option selected>10% free</option><option>15% free</option></select>${sw('setAlert', 1)}</div>
    <div class="srow"><div><div>Start with Windows</div><div class="sd">Starts in the tray, without admin rights.</div></div>${sw('setStart', 0)}</div>
    <div class="srow"><div><div>"Analyze with Lustro" in Explorer</div><div class="sd">Adds the command to the right-click menu of folders and drives.</div></div>${sw('setMenu', 1)}</div></div>
  <h3 class="sec">About</h3>
  <div class="card set">
    <div class="srow"><div><div>Lustro 0.1.0</div><div class="sd">Free and open source (MIT). Lustro is Latin for “I purify” and “I survey”.</div></div><button class="btn sm" data-act="update">${ic('refresh')}Check for updates</button></div>
    <div class="srow"><div><div>Check for updates automatically</div><div class="sd">From GitHub Releases.</div></div>${sw('setUpd', 1)}</div></div>
</div>` });

/* ---------- render ---------- */
const listEl = $('#list'), mainEl = $('#main'), detailEl = $('#detail');
function render() {
  const keepTree = document.querySelector('#tree')?.scrollTop, keepMain = mainEl.scrollTop, same = render._last === S.screen;
  const r = SCREENS[S.screen]();
  listEl.hidden = !r.list; listEl.innerHTML = r.list || '';
  mainEl.innerHTML = r.main; detailEl.hidden = !r.detail; detailEl.innerHTML = r.detail || '';
  if (same) { mainEl.scrollTop = keepMain; const t = document.querySelector('#tree'); if (t && keepTree != null) t.scrollTop = keepTree; }
  render._last = S.screen;
  renderChrome();
  r.after && r.after();
}
function applyTheme() {
  if (S.theme === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
  try { localStorage.setItem('lustro-mock-theme', S.theme); } catch (e) {}
}

/* ---------- dialog + toast ---------- */
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `${ic('check')}<span>${msg}</span>`; document.body.appendChild(t);
  clearTimeout(toast._t); toast._t = setTimeout(() => t.remove(), 3200);
}
function dialog({ title, body, ok, danger }, onOk) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><div class="db"><h3 id="dlgT">${title}</h3>${body}</div>
    <div class="df"><button class="btn ${danger ? '' : 'accent'}" data-k="ok" style="${danger ? 'background:var(--bad);color:#fff;border-color:transparent' : ''}">${ok}</button><button class="btn" data-k="cancel">Cancel</button></div></div>`;
  o.addEventListener('click', e => { const k = e.target.closest('[data-k]')?.dataset.k; if (k || e.target === o) { o.remove(); if (k === 'ok') onOk && onOk(); } });
  document.body.appendChild(o); o.querySelector('[data-k="cancel"]').focus();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = +el.dataset.id, v = el.dataset.v;
  if (el.type === 'checkbox') return; // handled on change
  switch (a) {
    case 'nav': S.screen = v; render(); mainEl.scrollTop = 0; break;
    case 'goto': S.screen = v; if (v === 'clean' && el.dataset.sub) S.cleanCat = el.dataset.sub; if (v === 'files' && el.dataset.sub) { S.filesTab = 'old'; S.chips.gb = false; } render(); break;
    case 'theme': S.theme = v; applyTheme(); render(); break;
    case 'admin':
      if (S.admin) break;
      dialog({ title: 'Restart Lustro as administrator?', body: '<p>Windows shows a User Account Control prompt. Lustro restarts and keeps your last scan, so you do not wait again.</p><p>With admin rights you get the fast scan, live updates, system folders and the system cleaner.</p>', ok: 'Restart as admin' },
        () => { S.admin = true; render(); toast('Lustro restarted as administrator. Fast scan and live updates are on.'); });
      break;
    case 'sel': {
      if (e.target.closest('[data-act="tw"]')) break;
      const n = BYID[id]; S.sel = n;
      if (el.classList.contains('trow') && n.c) { S.zoom = n; S.open.add(n.id); }
      if (el.classList.contains('tile')) { for (let x = n.parent; x; x = x.parent) S.open.add(x.id); S._scrollTree = true; }
      render(); break;
    }
    case 'tw': { const n = BYID[id]; S.open.has(id) ? S.open.delete(id) : S.open.add(id); if (S.open.has(id)) { S.zoom = n; S.sel = n; } render(); break; }
    case 'zoom': S.zoom = BYID[id]; S.sel = BYID[id]; render(); break;
    case 'up': if (S.zoom.parent) { S.sel = S.zoom; S.zoom = S.zoom.parent; render(); } break;
    case 'view': S.view = v; render(); break;
    case 'drive': if (v === 'C') { S.screen = 'explore'; S.zoom = C; S.sel = C; render(); } else toast('This mockup has sample folders for C: only.'); break;
    case 'recycle': { const n = BYID[id]; dialog({ title: 'Move to Recycle Bin?', body: `<p><b>${esc(n.n)}</b> · ${fmt(n.s)}</p><p class="mono">${esc(pathOf(n))}</p><p>You can restore it from History or from the Recycle Bin.</p>`, ok: 'Move to Recycle Bin' }, () => toast(`Moved “${esc(n.n)}” to the Recycle Bin (mockup, nothing changed).`)); break; }
    case 'perm': { const n = BYID[id]; dialog({ title: 'Delete permanently?', danger: 1, body: `<p><b>${esc(n.n)}</b> · ${fmt(n.s)}${n.c ? ` · ${n.items.toLocaleString('en-US')} items` : ''}</p><p class="mono">${esc(pathOf(n))}</p><p style="color:var(--bad)">You cannot undo this. The item does not go to the Recycle Bin.</p>`, ok: 'Delete permanently' }, () => toast(`Deleted “${esc(n.n)}” permanently (mockup, nothing changed).`)); break; }
    case 'recycle-files': case 'perm-files': {
      const sel = [...S.fileSel].map(i => FILES[i]), size = fmt(sel.reduce((s, f) => s + f.s, 0)), perm = a === 'perm-files';
      dialog({ title: perm ? `Delete ${sel.length} files permanently?` : `Move ${sel.length} files to the Recycle Bin?`, danger: perm, body: `<p>${size} in ${sel.length} files.</p>${perm ? '<p style="color:var(--bad)">You cannot undo this.</p>' : '<p>You can restore them from History.</p>'}`, ok: perm ? 'Delete permanently' : 'Move to Recycle Bin' },
        () => { toast(`${perm ? 'Deleted' : 'Moved'} ${sel.length} files · ${size} (mockup)`); S.fileSel.clear(); render(); });
      break;
    }
    case 'fclear': S.fileSel.clear(); render(); break;
    case 'ftab': S.filesTab = v; if (v === 'old') S.chips.gb = false; render(); break;
    case 'chip': S.chips[v] = !S.chips[v]; render(); break;
    case 'dupe': S.dupe = +el.dataset.i; render(); break;
    case 'dkeep': {
      const g = DUPES[S.dupe]; let keep = 0;
      if (v === 'old') keep = g.files.reduce((k, f, i) => f.d < g.files[k].d ? i : k, 0);
      if (v === 'new') keep = g.files.reduce((k, f, i) => f.d > g.files[k].d ? i : k, 0);
      if (v === 'c') keep = Math.max(0, g.files.findIndex(f => f.p.startsWith('C:')));
      S.dupeDel[S.dupe] = new Set(g.files.map((_, i) => i).filter(i => i !== keep)); render(); break;
    }
    case 'dupe-go': { const n = S.dupeDel.reduce((s, x) => s + x.size, 0); dialog({ title: `Move ${n} copies to the Recycle Bin?`, body: `<p>${fmt(dupeSave())} in ${DUPES.length} groups. One copy of each file stays.</p>`, ok: 'Move to Recycle Bin' }, () => toast(`Moved ${n} copies · ${fmt(dupeSave())} (mockup)`)); break; }
    case 'ccat': S.cleanCat = v; render(); break;
    case 'cexp': { const it = CLEAN.find(c => c.id === S.cleanCat).items[+el.dataset.k]; it.open = !it.open; render(); break; }
    case 'cnone': CLEAN.find(c => c.id === S.cleanCat).items.forEach(it => { it.on = 0; it.subs && it.subs.forEach(s => s.on = 0); }); render(); break;
    case 'csafe': CLEAN.find(c => c.id === S.cleanCat).items.forEach(it => { it.on = it.warn || it.n === 'Recycle Bin' || it.n.startsWith('Cargo') || it.n.startsWith('NuGet') || it.n.includes('stopped') || it.n.startsWith('Compact') ? 0 : 1; it.subs && it.subs.forEach(s => s.on = !/days|today/.test(s.a) ? 1 : 0); }); render(); break;
    case 'clean-go': {
      const total = CLEAN.reduce((s, c) => s + cleanSel(c), 0);
      const lines = CLEAN.filter(c => cleanSel(c) > 0).map(c => `<div style="display:flex;justify-content:space-between"><span>${c.n}</span><span class="num">${fmt(cleanSel(c))}</span></div>`).join('');
      dialog({ title: `Clean ${fmt(total)}?`, body: `<div style="display:flex;flex-direction:column;gap:4px">${lines}</div><p>These items are deleted permanently. Apps make these caches again when they need them.</p>`, ok: 'Clean' }, () => toast(`Cleaned ${fmt(total)} (mockup, nothing changed).`));
      break;
    }
    case 'app': if (!e.target.closest('button')) { S.app = +el.dataset.i; render(); } break;
    case 'asrc': S.appSrc = v; render(); break;
    case 'uninstall': { const ap = APPS[+el.dataset.i]; dialog({ title: `Uninstall ${esc(ap.n)}?`, body: `<p>Lustro starts the uninstaller of ${esc(ap.pub)}. Follow its steps to finish.</p>`, ok: 'Uninstall' }, () => toast(`Started the uninstaller of ${esc(ap.n)} (mockup).`)); break; }
    case 'restore': { const h = HIST[+el.dataset.i]; toast(`Restored “${esc(h.n)}” to ${esc(h.p)} (mockup).`); h.restore = 0; h.a = 'Recycle Bin'; h.restored = 1; render(); break; }
    case 'copy': { const t = v; try { navigator.clipboard.writeText(t).then(() => toast('Copied the path.'), () => toast(t)); } catch (err) { toast(t); } break; }
    case 'reveal': toast('Opens the folder in File Explorer (mockup).'); break;
    case 'rescan': toast(S.admin ? 'Fast scan of C: finished in 11.2 s (mockup).' : 'Folder walk started. Run as admin for the fast scan (mockup).'); break;
    case 'export': toast('Saves a CSV or HTML report (mockup).'); break;
    case 'pick': toast('Opens a folder picker (mockup).'); break;
    case 'update': toast('Lustro 0.1.0 is the latest version (mockup).'); break;
    case 'caption': toast('These buttons belong to Windows in the real app.'); break;
  }
});
document.addEventListener('dblclick', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const n = BYID[+t.dataset.id]; if (n.c) { S.zoom = n; S.sel = n; S.open.add(n.id); for (let x = n.parent; x; x = x.parent) S.open.add(x.id); render(); }
});
document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.act;
  if (a === 'fsel') { const i = +el.dataset.i; el.checked ? S.fileSel.add(i) : S.fileSel.delete(i); render(); }
  if (a === 'dsel') { const i = +el.dataset.i, s = S.dupeDel[S.dupe]; el.checked ? s.add(i) : s.delete(i); render(); }
  if (a === 'citem') { const it = CLEAN.find(c => c.id === S.cleanCat).items[+el.dataset.k]; if (it.subs) it.subs.forEach(s => s.on = el.checked ? 1 : 0); else it.on = el.checked ? 1 : 0; render(); }
  if (a === 'csub') { const it = CLEAN.find(c => c.id === S.cleanCat).items[+el.dataset.k]; it.subs[+el.dataset.j].on = el.checked ? 1 : 0; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; const r = searchRows(S.q); $('#qrows').innerHTML = r.html; $('#qinfo').textContent = `${r.hits.length} results · 1,431,882 files searched in 0.04 s`; }
  if (e.target.id === 'appQ') { S.appQ = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#appQ'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === 'treeFilter') { const f = e.target.value.toLowerCase(); document.querySelectorAll('#tree .trow').forEach(r => { r.hidden = f && !r.title.toLowerCase().includes(f); }); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.screen = 'search'; render(); $('#q')?.focus(); }
  if (e.key === 'Escape') document.querySelector('.overlay')?.remove();
});
new ResizeObserver(() => { if (S.screen === 'explore' && S.view === 'map') drawTreemap(); }).observe(mainEl);

applyTheme();
render();
</script>
