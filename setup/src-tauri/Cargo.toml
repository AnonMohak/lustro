[package]
name = "lustro-setup"
# The shown version comes from package.json (tauri.conf.json) and src-tauri/tauri.conf.json (build.rs).
version = "0.0.0"
description = "Themed installer for Lustro"
authors = ["Mohak"]
license = "MIT"
repository = "https://github.com/AnonMohak/lustro"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

# Small download first: the setup is a few screens.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
